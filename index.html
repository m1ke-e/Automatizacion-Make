<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="theme-color" content="#174c3c">
		<title>Registrar despacho | Distribuidora La Quinta</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
		<link href="css/styles.css" rel="stylesheet">
	</head>
	<body>
		<nav class="navbar navbar-expand-md navbar-dark site-navbar">
			<div class="container">
				<a class="navbar-brand" href="index.html">Distribuidora <span>La Quinta</span></a>
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Abrir navegación">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="mainNavigation">
					<ul class="navbar-nav ms-auto">
						<li class="nav-item">
							<a class="nav-link active" href="index.html" aria-current="page">Registrar despacho</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="historial.html">Historial</a>
						</li>
					</ul>
				</div>
			</div>
		</nav>

		<main class="container page-content">
			<header class="page-heading">
				<p class="eyebrow">Operaciones</p>
				<h1>Registrar despacho</h1>
				<p class="text-body-secondary mb-0">Distribuidora La Quinta S.A.S. <span aria-hidden="true">·</span> Cali</p>
			</header>

			<section class="content-panel" aria-labelledby="dispatch-section-title">
				<h2 id="dispatch-section-title" class="h5">Nuevo despacho</h2>
				<p class="text-body-secondary">Completa los datos del despacho.</p>

				<form id="dispatchForm">
					<div class="row g-3">
						<div class="col-12">
							<label for="productCode" class="form-label">Producto</label>
							<select class="form-select" id="productCode" name="codigoProducto" required>
								<option value="" selected disabled>Selecciona un producto</option>
								<option value="INS-0101">INS-0101 - Harina de trigo x 25 kg</option>
								<option value="INS-0102">INS-0102 - Azúcar refinada x 50 kg</option>
								<option value="INS-0203">INS-0203 - Aceite vegetal x 20 L</option>
								<option value="INS-0204">INS-0204 - Arroz blanco x 25 kg</option>
								<option value="INS-0305">INS-0305 - Servilletas x 1000 u</option>
								<option value="INS-0306">INS-0306 - Vasos desechables 7 oz x 2500</option>
								<option value="INS-0407">INS-0407 - Pollo congelado x 10 kg</option>
								<option value="INS-0408">INS-0408 - Queso mozzarella x 5 kg</option>
                                <option value="INS-9999">INS-9999 - Producto de ejemplo</option>
							</select>
							<div class="form-text">El código del producto aparece junto a su nombre.</div>
						</div>

						<div class="col-12 col-md-6">
							<label for="quantity" class="form-label">Cantidad</label>
							<input class="form-control" id="quantity" name="cantidad" type="number" min="0" step="any" required>
						</div>

						<div class="col-12 col-md-6">
							<label for="customer" class="form-label">Cliente</label>
							<input class="form-control" id="customer" name="cliente" type="text" autocomplete="organization" required>
						</div>

						<div class="col-12 col-md-6">
							<label for="email" class="form-label">Correo</label>
							<input class="form-control" id="email" name="correo" type="email" autocomplete="email" required>
						</div>

						<div class="col-12 col-md-6">
							<label for="destination" class="form-label">Destino</label>
							<input class="form-control" id="destination" name="destino" type="text" required>
						</div>

						<div class="col-12">
							<label for="reason" class="form-label">Motivo</label>
							<select class="form-select" id="reason" name="motivo" required>
								<option value="" selected disabled>Selecciona un motivo</option>
								<option value="despacho">Despacho</option>
								<option value="traslado entre sedes">Traslado entre sedes</option>
								<option value="avería">Avería</option>
							</select>
						</div>

						<div class="col-12">
							<label for="observations" class="form-label">Observaciones <span class="text-body-secondary">(opcional)</span></label>
							<textarea class="form-control" id="observations" name="observaciones" rows="3"></textarea>
						</div>

						<div class="col-12 d-flex justify-content-end">
							<button class="btn btn-primary" id="submitDispatch" type="submit">Enviar despacho</button>
						</div>
					</div>
				</form>
				<div id="requestStatus" class="alert d-none mt-3 mb-0" role="status" aria-live="polite"></div>
			</section>
		</main>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
		<script src="js/config.js"></script>
		<script src="js/registro.js"></script>
	</body>
</html>
